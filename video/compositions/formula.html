<!--
  CENA 2 — A FÓRMULA (2,5 s a 5,5 s do vídeo)
  "PENSAMENTO + EMOÇÃO = SEU ESTADO DE SER", montada peça por peça em recortes de papel:
    PENSAMENTO (papel branco, "mente")  →  +  →  EMOÇÃO (papel amarelo, "corpo")
    →  =  →  SEU ESTADO DE SER (papel preto, o resultado).
  Duas setas desenhadas à mão ligam as partes ao resultado.
  Corte seco na entrada; zoom lento no palco durante a cena.
-->
<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
    }
    #f-palco {
      position: absolute;
      inset: 0;
      transform-origin: 495px 860px;
    }
    /* Cada peça da equação é um recorte posicionado e centralizado em x = 495 */
    .f-peca {
      left: 495px;
      transform-origin: 50% 50%;
    }
    .f-peca .papel {
      padding: 26px 46px 30px;
      white-space: nowrap;
      text-align: center;
    }
    #f-pensamento {
      top: 450px;
    }
    #f-pensamento .papel {
      font-size: 92px;
    }
    #f-emocao {
      top: 760px;
    }
    #f-emocao .papel {
      font-size: 100px;
    }
    #f-estado {
      top: 1080px;
    }
    #f-estado .papel {
      font-size: 104px;
      padding: 40px 56px 46px;
      line-height: 1;
    }
    /* Sinais + e = em roxo, grandes */
    .f-sinal {
      position: absolute;
      left: 0;
      width: 990px;
      text-align: center;
      font-family: var(--font-titulo);
      font-weight: 900;
      font-size: 120px;
      line-height: 1;
      color: var(--tinta); /* preto: contraste alto sobre o creme */
    }
    #f-mais {
      top: 618px;
    }
    #f-igual {
      top: 935px;
    }
    /* Anotações pequenas em sans ("mente", "corpo") */
    .f-nota {
      position: absolute;
      right: -18px;
      bottom: -26px;
      transform: rotate(-4deg);
      font-size: 28px;
      color: var(--tinta);
      background: var(--marcatexto);
      padding: 6px 14px;
      box-shadow: 0 4px 8px rgba(40, 25, 5, 0.25);
    }
  </style>

  <div id="root" data-composition-id="formula" data-width="1080" data-height="1920">
    <div id="f-palco">
      <svg id="f-brilho" class="brilho" style="left:800px;top:960px;width:80px;height:80px" viewBox="-50 -50 100 100"><path d="M0,-48 C6,-10 10,-6 48,0 C10,6 6,10 0,48 C-6,10 -10,6 -48,0 C-10,-6 -6,-10 0,-48 Z" fill="#7B2FF7" stroke="#111111" stroke-width="4" /></svg>

      <div id="f-cabeca" class="recorte etiqueta"><div class="papel preto reto rotulo">A fórmula</div></div>

      <div id="f-pensamento" class="recorte f-peca dupla d-lilas"><div class="papel titulo">PENSAMENTO</div><div class="f-nota rotulo">mente</div></div>
      <div id="f-mais" class="f-sinal">+</div>
      <div id="f-emocao" class="recorte f-peca dupla d-preto fita"><div class="papel amarelo titulo">EMOÇÃO</div><div class="f-nota rotulo">corpo</div></div>
      <div id="f-igual" class="f-sinal">=</div>
      <div id="f-estado" class="recorte f-peca dupla d-roxo fita"><div class="papel preto reto titulo">SEU ESTADO<br />DE SER</div></div>


      <!-- Setas à mão: da esquerda (PENSAMENTO) e da direita (EMOÇÃO) até o resultado -->
      <svg class="camada" viewBox="0 0 1080 1920">
        <path id="f-seta-esq" class="traco" pathLength="1" stroke="#111111" stroke-width="8"
          d="M105,545 C55,700 50,1000 115,1170" />
        <path id="f-seta-esq-ponta" class="traco" pathLength="1" stroke="#111111" stroke-width="8"
          d="M80,1145 L118,1174 L128,1128" />
        <path id="f-seta-dir" class="traco" pathLength="1" stroke="#7B2FF7" stroke-width="8"
          d="M790,840 C900,900 925,1050 885,1170" />
        <path id="f-seta-dir-ponta" class="traco" pathLength="1" stroke="#7B2FF7" stroke-width="8"
          d="M868,1128 L882,1174 L918,1146" />
        <!-- sublinhado à mão sob o resultado -->
        <path id="f-sublinha" class="traco" pathLength="1" stroke="#FFD400" stroke-width="10" d="M320,1346 C440,1338 560,1350 670,1340" />
      </svg>
    </div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    // KEN BURNS: zoom lento no palco durante os 3 s.
    tl.fromTo("#f-palco", { scale: 1.0 }, { scale: 1.05, duration: 3, ease: "none" }, 0);

    // Cabeçalho "A FÓRMULA" já presente no corte (corte seco), só desfoca → nítido.
    tl.fromTo("#f-cabeca", { opacity: 0, xPercent: -50, rotation: 6 }, { opacity: 1, xPercent: -50, rotation: -2, duration: 0.25, ease: "back.out(1.6)" }, 0);

    tl.fromTo("#f-brilho", { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.35, ease: "back.out(2)" }, 0.2);

    // RECORTES: cada peça "cai" no papel com leve rotação e um pequeno quique
    // (as notas "mente" e "corpo" estão presas na peça e entram junto).
    // xPercent -50 centraliza a peça em x = 495.
    const colar = (alvo, t, rotFinal) =>
      tl.fromTo(
        alvo,
        { opacity: 0, xPercent: -50, scale: 1.35, rotation: rotFinal * -3, y: -30 },
        { opacity: 1, xPercent: -50, scale: 1, rotation: rotFinal, y: 0, duration: 0.42, ease: "back.out(1.5)" },
        t,
      );
    colar("#f-pensamento", 0.05, -2);
    // Sinal "+" aparece num estalo
    tl.fromTo("#f-mais", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, 0.45);
    colar("#f-emocao", 0.65, 2.5);
    tl.fromTo("#f-igual", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, 1.05);
    colar("#f-estado", 1.25, -1.5);


    // SETAS desenhadas à mão ligando as partes ao resultado (corpo da seta, depois a ponta).
    tl.fromTo("#f-seta-esq", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.inOut" }, 1.7);
    tl.fromTo("#f-seta-esq-ponta", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.12, ease: "power2.out" }, 2.08);
    tl.fromTo("#f-seta-dir", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.35, ease: "power2.inOut" }, 1.85);
    tl.fromTo("#f-seta-dir-ponta", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.12, ease: "power2.out" }, 2.18);

    // SUBLINHADO roxo sob "SEU ESTADO DE SER".
    tl.fromTo("#f-sublinha", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.inOut" }, 2.3);

    window.__timelines["formula"] = tl;
  </script>
</template>
