  <script>
    const tl = gsap.timeline({ paused: true });

    // KEN BURNS: aproximação lenta na folha.
    tl.fromTo("#m-palco", { scale: 1.0 }, { scale: 1.05, duration: 3, ease: "none" }, 0);

    // TÍTULO "O método": desfoque → nítido no corte.
    tl.fromTo("#m-titulo", { opacity: 0, xPercent: -50, rotation: 6, scale: 1.2 }, { opacity: 1, xPercent: -50, rotation: -2, scale: 1, duration: 0.3, ease: "back.out(1.5)" }, 0);
    tl.fromTo("#m-brilho", { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.35, ease: "back.out(2)" }, 0.2);
    // Jornal de apoio atrás do canto do caderno.
    tl.fromTo("#m-jornal", { opacity: 0, rotation: 15 }, { opacity: 1, rotation: 8, duration: 0.3, ease: "expo.out" }, 0.05);

    // FOLHA DE CADERNO: colada com leve rotação.
    tl.fromTo("#m-folha", { opacity: 0, rotation: 4, scale: 1.06 }, { opacity: 1, rotation: -1, scale: 1, duration: 0.35, ease: "expo.out" }, 0.02);

    // ITENS: cada linha entra deslizando um pouco da esquerda e, logo depois,
    // o check roxo se desenha na caixinha.
    const item = (alvo, check, t) => {
      tl.fromTo(alvo, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, t);
      tl.fromTo(check, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.2, ease: "power2.in" }, t + 0.25);
    };
    item("#m-i1", "#m-check1", 0.3);
    item("#m-i2", "#m-check2", 0.8);
    item("#m-i3", "#m-check3", 1.6);

    // ANTES: marca-texto amarelo pinta a palavra, depois o círculo roxo é desenhado.
    tl.fromTo("#m-mt", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.inOut" }, 1.15);
    tl.fromTo("#m-circ", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.4, ease: "power1.inOut" }, 1.45);

    window.__timelines["metodo"] = tl;
  </script>
