<!doctype html>
<!--
  "Como manifestar qualquer coisa, segundo Joe Dispenza"
  Explainer vertical para TikTok — 1080x1920, 30 fps, 15 s.

  Este arquivo é a composição raiz. Ele:
    1. define a paleta, as fontes e as peças de "colagem" usadas em todas as cenas;
    2. desenha o MUNDO de fundo: papel creme amassado com quadriculado + recortes nas bordas
       (jornal, papel preto rasgado com meio-tom, papel roxo, fitas adesivas, brilhos);
    3. monta as 5 cenas (compositions/*.html) em cortes secos, uma após a outra;
    4. põe por cima de tudo a vinheta e o granulado de filme.

  A cada corte, os recortes da borda "pulam" para um novo arranjo (como se a colagem
  fosse refeita) e o fundo faz um zoom lento tipo Ken Burns durante a cena.

  Área segura do TikTok: nada importante nos 250 px de baixo nem nos 150 px da direita.
  O conteúdo das cenas fica entre x = 70 e x = 920 e entre y ≈ 200 e y ≈ 1600.
  Os recortes decorativos das bordas podem ocupar as zonas de interface (são só textura).
-->
<html
  lang="pt-BR"
  data-composition-variables='[
    {"id":"creme","type":"color","label":"Creme (fundo)","default":"#F3EDE2"},
    {"id":"tinta","type":"color","label":"Preto (tinta)","default":"#111111"},
    {"id":"marcatexto","type":"color","label":"Amarelo marca-texto","default":"#FFD400"},
    {"id":"destaque","type":"color","label":"Roxo de destaque","default":"#7B2FF7"},
    {"id":"cinza","type":"color","label":"Cinza","default":"#8A8A8A"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* ---------- Paleta (variáveis editáveis no Studio) ---------- */
      :root {
        --creme: #f3ede2;
        --tinta: #111111;
        --marcatexto: #ffd400;
        --destaque: #7b2ff7; /* roxo de destaque (substitui o vermelho) */
        --lilas: #c9b3ff; /* roxo claro, só para recortes decorativos */
        --cinza: #8a8a8a;
        --papel-branco: #fbf8f1;
        --papel-jornal: #e9e2d2;
        /* Títulos: serifada forte. Rótulos/anotações: sans. */
        --font-titulo: "Playfair Display", Georgia, serif;
        --font-rotulo: "Inter", Arial, sans-serif;

        /* Textura fina de papel (ruído fractal em SVG, determinístico) */
        --ruido-fino: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='360' height='360'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' seed='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.22 0 0 0 0 0.17 0 0 0 0 0.10 0 0 0 0.40 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
        /* PAPEL AMASSADO: turbulência iluminada por uma luz rasante (feDiffuseLighting)
           cria vincos e dobras com relevo, como uma folha amassada e alisada. */
        --amassado: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1080' height='1920'><filter id='c' x='0' y='0' width='100%' height='100%'><feTurbulence type='turbulence' baseFrequency='0.0045 0.0065' numOctaves='5' seed='21' result='t'/><feDiffuseLighting in='t' surfaceScale='7' diffuseConstant='1.32' lighting-color='%23F6F0E4'><feDistantLight azimuth='235' elevation='55'/></feDiffuseLighting></filter><rect width='100%' height='100%' filter='url(%23c)'/></svg>");
        /* Granulado de filme (ruído preto e branco de alto contraste) */
        --grao: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='1.4' numOctaves='2' seed='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncA type='table' tableValues='0 0.9'/></feComponentTransfer></filter><rect width='100%' height='100%' filter='url(%23g)'/></svg>");
        /* Quadriculado de caderno (linhas finas a cada 72 px) */
        --quadriculado: repeating-linear-gradient(0deg, rgba(60, 50, 40, 0.13) 0 2px, transparent 2px 72px),
          repeating-linear-gradient(90deg, rgba(60, 50, 40, 0.13) 0 2px, transparent 2px 72px);
        /* Meio-tom (retícula de pontos de jornal) */
        --meio-tom: radial-gradient(circle, rgba(17, 17, 17, 0.9) 0 2.4px, transparent 2.9px);
        --meio-tom-claro: radial-gradient(circle, rgba(243, 237, 226, 0.55) 0 2.4px, transparent 2.9px);
        /* "Texto de jornal": linhas cinza em duas colunas */
        --linhas-jornal: linear-gradient(90deg, transparent 47%, var(--papel-jornal) 47% 53%, transparent 53%),
          repeating-linear-gradient(180deg, rgba(17, 17, 17, 0.5) 0 5px, transparent 5px 14px);

        /* Contorno de papel rasgado (bordas irregulares dos recortes) */
        --rasgado: polygon(0% 6%, 5% 0%, 13% 4%, 21% 0%, 30% 3%, 39% 0%, 50% 4%, 61% 0%, 72% 3%, 84% 0%, 93% 4%, 100% 1%, 99% 50%, 100% 95%, 91% 100%, 79% 96%, 67% 100%, 55% 96%, 43% 100%, 31% 96%, 19% 100%, 8% 96%, 0% 100%, 1% 52%);
        --rasgado-b: polygon(2% 3%, 14% 0%, 24% 5%, 37% 1%, 49% 6%, 60% 0%, 71% 4%, 85% 1%, 100% 5%, 97% 22%, 100% 41%, 96% 60%, 100% 80%, 97% 100%, 82% 95%, 70% 100%, 57% 94%, 44% 99%, 30% 94%, 17% 100%, 0% 96%, 3% 76%, 0% 55%, 4% 34%, 0% 15%);
        --recorte: polygon(1% 2%, 99% 0%, 100% 97%, 0% 100%);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--creme);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
        font-family: var(--font-rotulo);
        color: var(--tinta);
      }

      /* ---------- MUNDO de fundo (papel + colagem das bordas) ---------- */
      #mundo {
        position: absolute;
        inset: 0;
        z-index: 0;
        transform-origin: 50% 45%;
      }
      /* Papel creme amassado + quadriculado + fibra fina */
      #papel {
        position: absolute;
        inset: -40px;
        background-color: var(--creme);
        background-image: var(--ruido-fino), var(--quadriculado), var(--amassado);
        background-size: 360px 360px, auto, 1160px 2000px;
      }
      .peca-fundo {
        position: absolute;
      }
      /* Vinheta mais marcada nas bordas (papel envelhecido) */
      #vinheta {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 46% 45%, rgba(0, 0, 0, 0) 50%, rgba(50, 32, 10, 0.32) 100%);
        z-index: 50;
        pointer-events: none;
      }
      /* Granulado de filme por cima de tudo. É maior que o quadro para poder "tremer". */
      #grao-wrap {
        position: absolute;
        inset: 0;
        overflow: hidden;
        z-index: 60;
        pointer-events: none;
      }
      #grao {
        position: absolute;
        left: -150px;
        top: -150px;
        width: 1380px;
        height: 2220px;
        background-image: var(--grao);
        background-size: 300px 300px;
        opacity: 0.22;
        mix-blend-mode: multiply;
      }

      /* ---------- Peças de colagem compartilhadas pelas cenas ---------- */
      /* .recorte = um pedaço de papel com sombra suave. A sombra fica no invólucro
         (filter: drop-shadow), e o papel interno recebe o contorno irregular. */
      .recorte {
        position: absolute;
        filter: drop-shadow(0 10px 12px rgba(40, 25, 5, 0.32)) drop-shadow(0 2px 2px rgba(40, 25, 5, 0.3));
      }
      .papel {
        background-color: var(--papel-branco);
        background-image: var(--ruido-fino);
        background-size: 360px 360px;
        clip-path: var(--rasgado);
      }
      .papel.reto {
        clip-path: var(--recorte);
      }
      .papel.rasgado-b {
        clip-path: var(--rasgado-b);
      }
      .papel.amarelo {
        background-color: var(--marcatexto);
      }
      .papel.preto {
        background-color: var(--tinta);
        color: var(--creme);
      }
      .papel.roxo {
        background-color: var(--destaque);
        color: var(--papel-branco);
      }
      .papel.lilas {
        background-color: var(--lilas);
      }
      /* Recorte de jornal: papel amarelado com "colunas de texto" */
      .papel.jornal {
        background-color: var(--papel-jornal);
        background-image: var(--ruido-fino), var(--linhas-jornal);
        background-size: 360px 360px, auto;
        background-origin: content-box;
        padding: 26px 30px;
      }
      /* Retícula de meio-tom (sobre preto: pontos claros; sobre claro: pontos pretos) */
      .papel.pontos {
        background-image: var(--meio-tom), var(--ruido-fino);
        background-size: 11px 11px, 360px 360px;
      }
      .papel.preto.pontos {
        background-image: var(--meio-tom-claro), var(--ruido-fino);
      }

      /* CAMADA DUPLA: um segundo papel rasgado atrás do recorte, levemente girado.
         Fica dentro do invólucro .recorte, então gira e entra junto com ele. */
      .dupla::before {
        content: "";
        position: absolute;
        inset: -16px -22px -18px -20px;
        clip-path: var(--rasgado-b);
        transform: rotate(3.5deg);
        z-index: -1;
        background-color: var(--tinta);
      }
      .dupla.d-roxo::before {
        background-color: var(--destaque);
        transform: rotate(-3deg);
      }
      .dupla.d-preto::before {
        background-color: var(--tinta);
        background-image: var(--meio-tom-claro);
        background-size: 11px 11px;
      }
      .dupla.d-jornal::before {
        background-color: var(--papel-jornal);
        background-image: var(--linhas-jornal);
        transform: rotate(-4deg);
      }
      .dupla.d-lilas::before {
        background-color: var(--lilas);
        background-image: var(--meio-tom);
        background-size: 11px 11px;
        transform: rotate(4deg);
      }
      /* FITA ADESIVA translúcida prendendo o recorte (bordas serrilhadas) */
      .fita::after {
        content: "";
        position: absolute;
        top: -26px;
        left: calc(50% - 80px);
        width: 160px;
        height: 50px;
        background: rgba(246, 238, 214, 0.78);
        clip-path: polygon(0% 8%, 4% 0%, 96% 4%, 100% 14%, 97% 30%, 100% 50%, 96% 70%, 100% 88%, 95% 100%, 3% 96%, 0% 84%, 3% 64%, 0% 44%, 3% 24%);
        transform: rotate(-5deg);
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.05);
      }
      .fita.fita-canto::after {
        left: -46px;
        top: -10px;
        transform: rotate(-38deg);
      }

      .titulo {
        font-family: var(--font-titulo);
        font-weight: 900;
        line-height: 0.95;
        letter-spacing: -0.02em;
      }
      .rotulo {
        font-family: var(--font-rotulo);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }
      /* Marca-texto: um retângulo amarelo atrás da palavra, que "pinta" da esquerda
         para a direita (scaleX 0 → 1 animado pelo GSAP). */
      .mt {
        position: relative;
        display: inline-block;
        z-index: 0;
      }
      .mt-tinta {
        position: absolute;
        left: -0.08em;
        right: -0.08em;
        top: 0.18em;
        bottom: 0.02em;
        background: var(--marcatexto);
        z-index: -1;
        transform-origin: 0% 50%;
        border-radius: 0.08em 0.25em 0.12em 0.3em;
        mix-blend-mode: multiply;
      }
      /* Traços desenhados à mão (SVG). pathLength=1 + dasharray 1 permite
         "desenhar" qualquer traço animando stroke-dashoffset de 1 → 0. */
      .traco {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1;
      }
      svg.camada {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        overflow: visible;
        pointer-events: none;
      }
      /* Brilho de 4 pontas (estrelinha de colagem) */
      .brilho {
        position: absolute;
        width: 70px;
        height: 70px;
        overflow: visible;
      }

      /* ---------- Posições-base dos recortes da borda ---------- */
      #fb-jornal-topo { left: -70px; top: 30px; }
      #fb-jornal-topo .papel { width: 560px; height: 210px; }
      #fb-preto-topo { left: 760px; top: -70px; }
      #fb-preto-topo .papel { width: 420px; height: 300px; }
      #fb-roxo { left: 960px; top: 640px; }
      #fb-roxo .papel { width: 220px; height: 420px; }
      #fb-amarelo { left: -110px; top: 1080px; }
      #fb-amarelo .papel { width: 230px; height: 170px; }
      #fb-lilas { left: -120px; top: 520px; }
      #fb-lilas .papel { width: 210px; height: 300px; }
      #fb-preto-base { left: -150px; top: 1640px; }
      #fb-preto-base .papel { width: 600px; height: 360px; }
      #fb-jornal-base { left: 470px; top: 1690px; }
      #fb-jornal-base .papel { width: 680px; height: 300px; }
      #fb-fita-1 { left: 380px; top: 150px; }
      #fb-fita-2 { left: 880px; top: 1620px; }
      .fita-solta {
        width: 190px;
        height: 54px;
        background: rgba(246, 238, 214, 0.8);
        clip-path: polygon(0% 8%, 4% 0%, 96% 4%, 100% 14%, 97% 30%, 100% 50%, 96% 70%, 100% 88%, 95% 100%, 3% 96%, 0% 84%, 3% 64%, 0% 44%, 3% 24%);
      }
      #fb-brilho-1 { left: 940px; top: 330px; }
      #fb-brilho-2 { left: 40px; top: 1450px; }
      #fb-brilho-3 { left: 960px; top: 1240px; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1080"
      data-height="1920"
    >
      <!-- MUNDO DE FUNDO: papel amassado + recortes nas bordas (fixos, rearranjados a cada corte) -->
      <div id="mundo" data-layout-ignore>
        <div id="papel"></div>

        <div id="fb-jornal-topo" class="recorte peca-fundo"><div class="papel jornal"></div></div>
        <div id="fb-preto-topo" class="recorte peca-fundo"><div class="papel preto pontos rasgado-b"></div></div>
        <div id="fb-lilas" class="recorte peca-fundo"><div class="papel lilas pontos rasgado-b"></div></div>
        <div id="fb-roxo" class="recorte peca-fundo"><div class="papel roxo"></div></div>
        <div id="fb-amarelo" class="recorte peca-fundo"><div class="papel amarelo rasgado-b"></div></div>
        <div id="fb-preto-base" class="recorte peca-fundo"><div class="papel preto pontos"></div></div>
        <div id="fb-jornal-base" class="recorte peca-fundo"><div class="papel jornal rasgado-b"></div></div>
        <div id="fb-fita-1" class="peca-fundo fita-solta"></div>
        <div id="fb-fita-2" class="peca-fundo fita-solta"></div>

        <!-- Brilhos de 4 pontas -->
        <svg id="fb-brilho-1" class="brilho peca-fundo" viewBox="-50 -50 100 100"><path d="M0,-48 C6,-10 10,-6 48,0 C10,6 6,10 0,48 C-6,10 -10,6 -48,0 C-10,-6 -6,-10 0,-48 Z" fill="#7B2FF7" stroke="#111111" stroke-width="4" /></svg>
        <svg id="fb-brilho-2" class="brilho peca-fundo" viewBox="-50 -50 100 100"><path d="M0,-48 C6,-10 10,-6 48,0 C10,6 6,10 0,48 C-6,10 -10,6 -48,0 C-10,-6 -6,-10 0,-48 Z" fill="#FFD400" stroke="#111111" stroke-width="4" /></svg>
        <svg id="fb-brilho-3" class="brilho peca-fundo" viewBox="-50 -50 100 100"><path d="M0,-48 C6,-10 10,-6 48,0 C10,6 6,10 0,48 C-6,10 -10,6 -48,0 C-10,-6 -6,-10 0,-48 Z" fill="#111111" /></svg>
      </div>

      <!-- As 5 cenas, em cortes secos: cada uma começa exatamente quando a anterior termina -->
      <div
        id="gancho"
        data-composition-id="gancho"
        data-composition-src="compositions/gancho.html"
        data-start="0"
        data-duration="2.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="formula"
        data-composition-id="formula"
        data-composition-src="compositions/formula.html"
        data-start="2.5"
        data-duration="3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="problema"
        data-composition-id="problema"
        data-composition-src="compositions/problema.html"
        data-start="5.5"
        data-duration="3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="metodo"
        data-composition-id="metodo"
        data-composition-src="compositions/metodo.html"
        data-start="8.5"
        data-duration="3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="fechamento"
        data-composition-id="fechamento"
        data-composition-src="compositions/fechamento.html"
        data-start="11.5"
        data-duration="3.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Camadas de acabamento por cima de todas as cenas -->
      <div id="vinheta"></div>
      <div id="grao-wrap"><div id="grao"></div></div>

      <!-- Sem música: não há arquivo de áudio na pasta (a trilha entra no próprio TikTok). -->
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      // Gerador pseudoaleatório com semente fixa: todo render sai idêntico (nada de Math.random()).
      let semente = 7;
      const aleatorio = () => ((semente = (semente * 16807) % 2147483647) / 2147483647);
      const entre = (a, b) => a + (b - a) * aleatorio();

      // 1) GRANULADO: a cada 2 quadros (1/15 s) a camada de ruído salta para uma posição nova.
      for (let i = 0; i < 15 * 15; i++) {
        tl.set("#grao", { x: Math.round(entre(-140, 140)), y: Math.round(entre(-140, 140)) }, i / 15);
      }

      // 2) COLAGEM QUE SE REFAZ A CADA CORTE: em cada início de cena, cada recorte da borda
      //    salta (sem transição) para um novo deslocamento e rotação — como se o editor
      //    tivesse recolado a página. Dá ritmo aos cortes secos.
      const cortes = [0, 2.5, 5.5, 8.5, 11.5];
      const pecas = gsap.utils.toArray(".peca-fundo");
      cortes.forEach((t) => {
        pecas.forEach((p) => {
          tl.set(p, { x: Math.round(entre(-90, 90)), y: Math.round(entre(-70, 70)), rotation: +entre(-18, 18).toFixed(1) }, t);
        });
      });

      // 3) KEN BURNS DO FUNDO: dentro de cada cena o mundo de fundo aproxima devagar
      //    (1.00 → 1.05) e volta ao zero no corte seguinte.
      const fins = [2.5, 5.5, 8.5, 11.5, 15];
      cortes.forEach((t, i) => {
        tl.fromTo(
          "#mundo",
          { scale: 1, rotation: i % 2 ? 0.6 : -0.6 },
          { scale: 1.05, rotation: 0, duration: fins[i] - t, ease: "none", immediateRender: i === 0 },
          t,
        );
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
